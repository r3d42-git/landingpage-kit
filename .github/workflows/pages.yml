name: Handbuch prüfen
on:
  push:
    branches: [main]
    paths: ['docs/**', 'examples/**', 'compose.yaml', '.github/workflows/pages.yml']
  pull_request:
    paths: ['docs/**', 'examples/**', 'compose.yaml', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  downloads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Handbuch-Downloads mit den installierbaren Vorlagen vergleichen
        run: |
          for original in compose.yaml examples/*.yaml; do
            cmp "$original" "docs/downloads/${original##*/}"
          done
          for original in examples/en/*.yaml; do
            cmp "$original" "docs/downloads/en/${original##*/}"
          done
